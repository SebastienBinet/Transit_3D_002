<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transit-3D</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.177.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.177.0/examples/jsm/"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a12; color: #cdd; font-family: monospace; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }

    #hud {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; align-items: center;
      background: rgba(0,0,0,0.7); padding: 10px 18px; border-radius: 10px;
      border: 1px solid #334;
    }
    button {
      background: #1a2a3a; color: #cdd; border: 1px solid #446;
      padding: 6px 14px; border-radius: 5px; cursor: pointer; font-family: monospace;
      font-size: 13px;
    }
    button:hover { background: #2a3a5a; }
    select {
      background: #1a2a3a; color: #cdd; border: 1px solid #446;
      padding: 6px 8px; border-radius: 5px; font-family: monospace; font-size: 13px;
    }
    #time-display { min-width: 90px; text-align: center; font-size: 13px; color: #88aadd; }

    #legend {
      position: fixed; top: 16px; left: 16px;
      background: rgba(0,0,0,0.6); padding: 10px 14px; border-radius: 8px;
      border: 1px solid #334; font-size: 12px; line-height: 1.8;
    }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }

    #prob-display {
      position: fixed; top: 16px; right: 16px;
      background: rgba(0,0,0,0.6); padding: 10px 14px; border-radius: 8px;
      border: 1px solid #334; font-size: 12px; line-height: 2;
    }
    #debug-overlay {
      position: fixed; bottom: 70px; right: 16px;
      background: rgba(0,0,0,0.85); padding: 8px 12px; border-radius: 8px;
      border: 1px solid #556; font-size: 11px; line-height: 1.7;
      color: #aaffaa; font-family: monospace; min-width: 260px;
    }
    #debug-overlay span { color: #ffee88; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="legend">
    <div><span class="dot" style="background:#4488ff"></span>L42 (tronc)</div>
    <div><span class="dot" style="background:#ff8844"></span>L17 (filet)</div>
    <div><span class="dot" style="background:#44cc44"></span>L33 (cible)</div>
    <div style="margin-top:6px; color:#888; font-size:11px">Axe vertical = temps</div>
  </div>

  <div id="prob-display">
    <div>P(attraper L33) : <span id="prob-l33">—</span></div>
    <div>P(attraper L17) : <span id="prob-l17">—</span></div>
    <div id="suggestion" style="margin-top:6px; font-weight:bold; font-size:13px; color:#ffee44">—</div>
    <div id="arrival" style="margin-top:3px; font-size:11px; color:#aabbcc">Arrivée estimée : —</div>
  </div>

  <div id="debug-overlay">
    tick Δ : <span id="dbg-tick-delta">—</span><br>
    tick max Δ : <span id="dbg-tick-max">—</span><br>
    drawFrame ms : <span id="dbg-draw-ms">—</span><br>
    drawFrame max : <span id="dbg-draw-max">—</span><br>
    frames/s : <span id="dbg-fps">—</span><br>
    frame # : <span id="dbg-frame-idx">—</span>
  </div>

  <div id="hud">
    <select id="scenario-select">
      <option value="1">Cas 1 — nominal</option>
      <option value="2">Cas 2 — repli</option>
    </select>
    <button id="btn-rewind">⏮</button>
    <button id="btn-play">▶ Play</button>
    <button id="btn-pause">⏸ Pause</button>
    <select id="speed-select">
      <option value="5">×5</option>
      <option value="20" selected>×20</option>
      <option value="60">×60</option>
      <option value="120">×120</option>
    </select>
    <span id="time-display">T = 0 s</span>
  </div>

  <script type="module">
    import { init, renderFrame, lastDrawMs } from './js/renderer.js';
    import { createPlayer, loadScenario } from './js/player.js';

    const canvas = document.getElementById('canvas');
    let player = null;
    let routes = null;
    let lastTs = null;

    async function load(scenarioId) {
      const data = await loadScenario(`./data/scenario${scenarioId}.json`);
      routes = data.routes;
      init(canvas, { routes });
      player = createPlayer(data.frames);
      player.setSpeed(Number(document.getElementById('speed-select').value));
      update();
    }

    // Mise à jour DOM : appelée à chaque tick RAF pour un affichage fluide
    function updateHud() {
      if (!player || !routes) return;
      document.getElementById('time-display').textContent =
        `T = ${Math.round(player.simTime)} s`;
      const transfers = player.frame?.transfers ?? [];
      const l33 = transfers.find(t => t.to_vehicle_id === 'L33-util');
      const l17 = transfers.find(t => t.to_vehicle_id === 'L17-util');
      document.getElementById('prob-l33').textContent =
        l33 ? (l33.probability * 100).toFixed(1) + ' %' : '—';
      document.getElementById('prob-l17').textContent =
        l17 ? (l17.probability * 100).toFixed(1) + ' %' : '—';
      const probL33 = l33?.probability ?? 0;
      const sugEl = document.getElementById('suggestion');
      const connectorId = probL33 >= 0.50 ? 'L33-util' : 'L17-util';
      if (probL33 >= 0.50) {
        sugEl.textContent = '→ Rester sur L42, transfert à P3 → L33';
        sugEl.style.color = '#44cc44';
      } else {
        sugEl.textContent = '→ Descendre à P1, prendre L17';
        sugEl.style.color = '#ff8844';
      }
      const connVeh = player.frame?.vehicles?.find(v => v.vehicle_id === connectorId);
      const connRoute = routes.find(r => r.line_id === connectorId.split('-')[0]);
      let tArrival = null;
      if (connVeh && connRoute) {
        const LAT_M = 111000;
        const lm = LAT_M * Math.cos(connRoute.shape[0].lat * Math.PI / 180);
        let rLen = 0;
        for (let i = 1; i < connRoute.shape.length; i++) {
          const dy = (connRoute.shape[i].lat - connRoute.shape[i-1].lat) * LAT_M;
          const dx = (connRoute.shape[i].lon - connRoute.shape[i-1].lon) * lm;
          rLen += Math.sqrt(dy*dy + dx*dx);
        }
        for (const pt of connVeh.trajectory) {
          if (pt.p50 >= rLen * 0.97) { tArrival = pt.t; break; }
        }
      }
      const arrEl = document.getElementById('arrival');
      arrEl.textContent = tArrival != null
        ? `Arrivée estimée : T = ${Math.round(tArrival)} s (${Math.floor(tArrival/60)} min ${Math.round(tArrival%60)} s)`
        : 'Arrivée estimée : hors horizon';
    }

    // Appelée lors du chargement initial et du rembobinage
    function update() {
      if (!player || !routes) return;
      renderFrame(player.frame, routes);
      updateHud();
    }

    // Métriques de debug
    const dbg = {
      tickDelta: 0, tickDeltaMax: 0,
      drawMax: 0, fps: 0,
      frameIdx: 0,
      _fpsCount: 0, _fpsTs: 0,
    };
    function updateDebug(rawDeltaMs) {
      dbg.tickDelta = rawDeltaMs;
      if (rawDeltaMs > dbg.tickDeltaMax) dbg.tickDeltaMax = rawDeltaMs;
      const drawMs = lastDrawMs; // live binding depuis renderer.js
      if (drawMs > dbg.drawMax) dbg.drawMax = drawMs;
      dbg._fpsCount++;
      const now = performance.now();
      if (now - dbg._fpsTs >= 1000) {
        dbg.fps = dbg._fpsCount;
        dbg._fpsCount = 0;
        dbg._fpsTs = now;
        // Réinitialiser les max toutes les secondes
        dbg.tickDeltaMax = rawDeltaMs;
        dbg.drawMax = drawMs;
      }
      document.getElementById('dbg-tick-delta').textContent = rawDeltaMs.toFixed(1) + ' ms';
      document.getElementById('dbg-tick-max').textContent  = dbg.tickDeltaMax.toFixed(1) + ' ms';
      document.getElementById('dbg-draw-ms').textContent   = drawMs.toFixed(1) + ' ms';
      document.getElementById('dbg-draw-max').textContent  = dbg.drawMax.toFixed(1) + ' ms';
      document.getElementById('dbg-fps').textContent       = dbg.fps;
      document.getElementById('dbg-frame-idx').textContent = dbg.frameIdx;
    }

    function tick(ts) {
      requestAnimationFrame(tick);
      const rawDeltaMs = lastTs !== null ? (ts - lastTs) : 0;
      if (lastTs !== null && player?.isPlaying) {
        const wallDelta = Math.min(rawDeltaMs / 1000, 0.1);
        const frameChanged = player.tick(wallDelta);
        if (frameChanged) {
          dbg.frameIdx++;
          renderFrame(player.frame, routes);
        }
        updateHud();
      }
      if (lastTs !== null) updateDebug(rawDeltaMs);
      lastTs = ts;
    }

    document.getElementById('btn-play').onclick    = () => player?.play();
    document.getElementById('btn-pause').onclick   = () => player?.pause();
    document.getElementById('btn-rewind').onclick  = () => { player?.seekTo(0); update(); };
    document.getElementById('speed-select').onchange = e =>
      player?.setSpeed(Number(e.target.value));
    document.getElementById('scenario-select').onchange = e => load(e.target.value);

    await load(1);
    requestAnimationFrame(tick);
  </script>
</body>
</html>
