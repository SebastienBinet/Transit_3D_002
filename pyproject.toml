[project]
name = "transit-3d"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pillow>=12.2.0",
    "pydantic>=2.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "fastapi>=0.136.3",
    "pytest>=9.0.3",
    "uvicorn>=0.48.0",
]
