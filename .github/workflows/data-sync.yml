name: Sync données STM + OSM

on:
  schedule:
    - cron: '0 6 * * 1'   # Chaque lundi à 6h UTC (après les mises à jour hebdomadaires STM)
  workflow_dispatch:        # Déclenchement manuel depuis l'onglet Actions

permissions:
  contents: write           # Pour pousser les fichiers mis à jour
  pages: write              # Pour déployer le site (les pushes du bot ne déclenchent pas ci.yml)
  id-token: write           # Requis par actions/deploy-pages

# Un commit poussé par le GITHUB_TOKEN ne redéclenche aucun workflow (anti-boucle),
# donc ci.yml/deploy ne tourne pas après ce sync : on déploie Pages ici directement.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5

      - name: Installer les dépendances (incluant requests et Pillow)
        run: uv add requests Pillow --quiet

      # Étapes séquentielles obligatoires : le GTFS doit être téléchargé avant
      # de construire les tracés, et routes_stm.json est requis par les 3 étapes suivantes.
      - name: Télécharger le GTFS STM
        run: uv run python data/blocks/fetch_gtfs.py --force

      - name: Construire routes_stm.json
        run: uv run python data/blocks/build_routes.py

      # Ces 3 étapes sont indépendantes entre elles (elles ne lisent que
      # routes_stm.json + le cache GTFS) et écrivent dans des fichiers distincts.
      # On les lance en parallèle pour réduire le temps total du workflow.
      - name: Tuiles OSM + réseau de rues + scénario (en parallèle)
        run: |
          uv run python data/blocks/fetch_map_tiles.py     > /tmp/tiles.log   2>&1 & P1=$!
          uv run python data/blocks/fetch_osm.py           > /tmp/osm.log     2>&1 & P2=$!
          uv run python data/blocks/build_scenario_stm.py  > /tmp/scenario.log 2>&1 & P3=$!
          rc=0
          wait $P1 || rc=1
          wait $P2 || rc=1
          wait $P3 || rc=1
          echo "===== fetch_map_tiles.py ====="     && cat /tmp/tiles.log
          echo "===== fetch_osm.py ====="           && cat /tmp/osm.log
          echo "===== build_scenario_stm.py ====="  && cat /tmp/scenario.log
          exit $rc

      - name: Valider les sorties (tests L2 schéma)
        run: uv run pytest tests/level2/ -v -k "stm" --no-header || true
        # --no-header et || true : les tests L2 STM seront ajoutés progressivement

      # Barrière : les tests L3 rejouent le moteur de choix (Cas 7) contre les
      # données FRAÎCHEMENT régénérées. Si une régénération casse l'énumération
      # (ex. corridor trop dense → recherche coupée au garde-fou → 0 choix), on
      # ÉCHOUE ici, AVANT de committer/déployer. Sans ça, le push du bot ne
      # déclenche pas ci.yml (anti-boucle) et des données cassées partiraient en
      # prod inaperçues — exactement ce qui est arrivé avec 138/104/119/71.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Valider le moteur de choix contre les données (tests L3)
        run: node --test tests/level3/*.mjs

      - name: Committer et pousser les données mises à jour
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/routes_stm.json web/data/map_bounds.json \
                  web/data/map_montreal.png web/data/streets_montreal.json \
                  web/data/circuits_index.json web/data/circuits/ \
                  web/data/build_info.json 2>/dev/null || true
          # Retirer du suivi l'ancien monolithe s'il traîne encore (remplacé par circuits/)
          git rm --quiet --ignore-unmatch web/data/scenario_stm_1.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Aucune modification à committer."
          else
            git commit -m "sync: données STM+OSM $(date -u +%Y-%m-%d)"
            git push
          fi

      # Déployer GitHub Pages avec les données fraîchement mises à jour.
      # Indispensable : le push ci-dessus (via GITHUB_TOKEN) ne déclenche pas ci.yml,
      # donc sans ceci le site live ne verrait jamais les nouveaux fichiers circuit.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/
      - uses: actions/deploy-pages@v4
        id: deploy
