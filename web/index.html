<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transit-3D</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.177.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.177.0/examples/jsm/"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a12; color: #cdd; font-family: monospace; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }

    #hud {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; align-items: center;
      background: rgba(0,0,0,0.7); padding: 10px 18px; border-radius: 10px;
      border: 1px solid #334;
    }
    button {
      background: #1a2a3a; color: #cdd; border: 1px solid #446;
      padding: 6px 14px; border-radius: 5px; cursor: pointer; font-family: monospace;
      font-size: 13px;
    }
    button:hover { background: #2a3a5a; }
    select {
      background: #1a2a3a; color: #cdd; border: 1px solid #446;
      padding: 6px 8px; border-radius: 5px; font-family: monospace; font-size: 13px;
    }
    #time-display { min-width: 90px; text-align: center; font-size: 13px; color: #88aadd; }
    #clock-display {
      min-width: 78px; text-align: center; font-size: 13px; font-weight: bold;
      color: #ffd877; letter-spacing: 0.5px;
    }

    /* Les panneaux d'interface restent au-dessus de la couche d'étiquettes CSS2D (z-index:1) */
    #hud, #legend, #prob-display, #debug-overlay, #build-info { z-index: 10; }

    /* Étiquettes d'heure aux coins des étages de 30 min (rendu CSS2D) */
    .time-grid-label {
      color: #aac6ee; font-family: monospace; font-size: 11px;
      background: rgba(8,12,24,0.55); padding: 1px 5px; border-radius: 4px;
      pointer-events: none; white-space: nowrap;
    }

    #legend {
      position: fixed; top: 16px; left: 16px;
      background: rgba(0,0,0,0.6); padding: 10px 14px; border-radius: 8px;
      border: 1px solid #334; font-size: 12px; line-height: 1.8;
      max-height: 78vh; overflow-y: auto;
    }
    #legend .legend-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }

    #prob-display {
      position: fixed; top: 16px; right: 68px;
      background: rgba(0,0,0,0.6); padding: 10px 14px; border-radius: 8px;
      border: 1px solid #334; font-size: 12px; line-height: 2;
    }
    #debug-overlay {
      position: fixed; bottom: 70px; right: 16px;
      background: rgba(0,0,0,0.85); padding: 8px 12px; border-radius: 8px;
      border: 1px solid #556; font-size: 11px; line-height: 1.7;
      color: #aaffaa; font-family: monospace; min-width: 260px;
    }
    #debug-overlay span { color: #ffee88; }
    #build-info {
      position: fixed; bottom: 20px; left: 16px;
      background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 6px;
      border: 1px solid #334; font-size: 10px; color: #667; font-family: monospace;
      line-height: 1.7;
    }

    /* Rose des vents — toujours visible en haut à droite, tourne avec l'azimut caméra */
    #compass {
      position: fixed; top: 16px; right: 16px; z-index: 15;
      width: 52px; height: 52px; pointer-events: none; opacity: 0.80;
      transform-origin: center center;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="legend">
    <div><span class="dot" style="background:#4488ff"></span>L42 (tronc)</div>
    <div><span class="dot" style="background:#ff8844"></span>L17 (filet)</div>
    <div><span class="dot" style="background:#44cc44"></span>L33 (cible)</div>
    <div style="margin-top:6px; color:#888; font-size:11px">Axe vertical = temps</div>
  </div>

  <div id="prob-display">
    <div>P(attraper L33) : <span id="prob-l33">—</span></div>
    <div>P(attraper L17) : <span id="prob-l17">—</span></div>
    <div id="suggestion" style="margin-top:6px; font-weight:bold; font-size:13px; color:#ffee44">—</div>
    <div id="arrival" style="margin-top:3px; font-size:11px; color:#aabbcc">Arrivée estimée : —</div>
  </div>

  <!-- Rose des vents : tourne avec l'azimut caméra, posée en haut à droite -->
  <div id="compass">
    <svg viewBox="0 0 52 52" width="52" height="52" xmlns="http://www.w3.org/2000/svg">
      <circle cx="26" cy="26" r="24" fill="rgba(0,0,0,0.55)" stroke="#334455" stroke-width="1.5"/>
      <!-- Flèche Nord (rouge, vers le haut) -->
      <polygon points="26,4 22,26 26,22 30,26" fill="#dd4444"/>
      <!-- Flèche Sud (gris, vers le bas) -->
      <polygon points="26,48 22,26 26,30 30,26" fill="#557788"/>
      <!-- Centre -->
      <circle cx="26" cy="26" r="2.5" fill="#aabbcc"/>
      <!-- Étiquette N (restera en haut de la flèche quand la rose tourne) -->
      <text x="26" y="3.5" text-anchor="middle" dominant-baseline="auto"
            font-size="8" fill="#ee7777" font-family="monospace" font-weight="bold">N</text>
    </svg>
  </div>

  <div id="debug-overlay">
    tick Δ : <span id="dbg-tick-delta">—</span><br>
    tick max Δ : <span id="dbg-tick-max">—</span><br>
    drawFrame ms : <span id="dbg-draw-ms">—</span><br>
    drawFrame max : <span id="dbg-draw-max">—</span><br>
    frames/s : <span id="dbg-fps">—</span><br>
    frame # : <span id="dbg-frame-idx">—</span>
  </div>

  <div id="build-info">Sim : —<br>Visu : —</div>

  <!-- Cas 7 : curseurs temporaires pour caler les constantes du flux de bonhommes -->
  <div id="stream-controls" style="display:none; position:fixed; top:16px; right:130px; z-index:12;
       background:rgba(0,0,0,0.72); padding:9px 12px; border-radius:8px; border:1px solid #446;
       font-size:11px; color:#cdd; font-family:monospace; line-height:1.9;">
    <div style="color:#ffdd66; font-weight:bold; margin-bottom:3px;">Flux surlignage (essai)</div>
    <div>Mode
      <select id="stream-mode" style="font-size:10px; padding:1px 3px;">
        <option value="ground" selected>Au sol</option>
        <option value="spacetime">Espace-temps</option>
        <option value="both">Au sol + Espace-temps</option>
      </select>
    </div>
    <div>Espacement <span id="stream-spacing-val">1</span> min<br>
      <input id="stream-spacing" type="range" min="0.5" max="10" step="0.5" value="1" style="width:130px;">
    </div>
    <div>Vitesse ×<span id="stream-speed-val">100</span><br>
      <input id="stream-speed" type="range" min="10" max="300" step="10" value="100" style="width:130px;">
    </div>
  </div>

  <div id="hud">
    <select id="scenario-select">
      <option value="1">Cas 1 — nominal</option>
      <option value="2">Cas 2 — repli</option>
      <option value="3">Cas 3 — cône de marche</option>
      <option value="4">Cas 4 — lignes STM réelles</option>
      <option value="5">Cas 5 — STM simulation horaires</option>
      <option value="6">Cas 6 — Trajets 51∩66 → 480∩144</option>
      <option value="7">Cas 7 — Choix vivants 51∩66 → 480∩144</option>
    </select>
    <button id="btn-rewind">⏮</button>
    <button id="btn-play">▶ Play</button>
    <button id="btn-pause">⏸ Pause</button>
    <select id="speed-select">
      <option value="5">×5</option>
      <option value="20" selected>×20</option>
      <option value="60">×60</option>
      <option value="120">×120</option>
    </select>
    <span id="time-display">T = 0 s</span>
    <span id="clock-display" title="Heure locale (horaires réels STM)"></span>
    <select id="viz-mode-select" title="Mode de visualisation">
      <option value="windows">Fenêtres</option>
      <option value="fork">Fourche</option>
    </select>
    <label id="p50-toggle" title="Afficher la ligne médiane p50"
           style="display:flex; align-items:center; gap:5px; cursor:pointer; user-select:none;">
      <input type="checkbox" id="chk-p50" checked style="cursor:pointer;">
      p50
    </label>
    <label id="uncertainty-toggle" title="Afficher le ruban d'incertitude p10–p90"
           style="display:flex; align-items:center; gap:5px; cursor:pointer; user-select:none;">
      <input type="checkbox" id="chk-uncertainty" style="cursor:pointer;">
      p10–p90
    </label>
  </div>

  <script type="module">
    import { init, renderFrame, lastDrawMs, setVizMode, updateSimTime, setShowUncertainty, setShowP50, getAzimuthalAngle, initPassengers, setPassengerSource, setPassengerT0, setJourneyHighlight, setHighlightStream, setStreamParams } from './js/renderer.js';
    import { createPlayer, loadScenario } from './js/player.js';
    import { createScheduleModel, loadCircuits } from './js/scenario-model.js';
    import { createJourneyModel } from './js/journey-model.js';
    import { createJourneyPanel } from './js/journey-panel.js';
    import { createChoiceEngine } from './js/choice-engine.js';
    import { createChoicePanel } from './js/choice-panel.js';
    import { JOURNEY_COLORS } from './js/colors.js';
    import { create as createWalkMode } from './js/viz-mode-walk.js';

    const canvas = document.getElementById('canvas');
    let player = null;
    let routes = null;
    let lastTs = null;
    let walkMode = null;
    let journeyPanel = null;
    let choiceEngine = null;   // Cas 7 — remis à zéro au rembobinage

    // Légende « récit » d'origine (cas 1/2) — restaurée hors du cas 5.
    const storyLegendHTML = document.getElementById('legend').innerHTML;
    function restoreStoryLegend() {
      document.getElementById('legend').innerHTML = storyLegendHTML;
    }

    // "51N" → "51 Nord", "165S" → "165 Sud". Sinon renvoie l'identifiant tel quel.
    function lineDisplayName(lineId) {
      const m = /^(\d+)([NS])$/.exec(lineId);
      if (!m) return lineId;
      return `${m[1]} ${m[2] === 'N' ? 'Nord' : 'Sud'}`;
    }

    // Légende dynamique du cas 5 : un point coloré + nom par circuit, trié par
    // numéro de ligne puis Nord avant Sud. Les circuits sans passage sont grisés.
    function setCircuitLegend(indexCircuits) {
      const sorted = [...indexCircuits].sort((a, b) => {
        const na = parseInt(a.line_id, 10), nb = parseInt(b.line_id, 10);
        if (na !== nb) return na - nb;
        return a.line_id.localeCompare(b.line_id);
      });
      const rows = sorted.map(c => {
        const color = c.color ?? '#888';
        const empty = (c.n_trips === 0);
        const style = empty ? ' style="opacity:0.4"' : '';
        const suffix = empty ? ' <span style="color:#888">(aucun passage)</span>' : '';
        return `<div${style}><span class="dot" style="background:${color}"></span>`
             + `${lineDisplayName(c.line_id)}${suffix}</div>`;
      }).join('');
      document.getElementById('legend').innerHTML =
        `<div style="margin-bottom:6px; color:#aac; font-weight:bold">Circuits STM</div>`
        + `<div class="legend-cols">${rows}</div>`
        + `<div style="margin-top:8px; color:#888; font-size:11px">Axe vertical = temps</div>`;
    }

    function teardownWalkMode() {
      if (walkMode) { walkMode.dispose(); walkMode = null; }
    }

    function teardownJourneyPanel() {
      if (journeyPanel) { journeyPanel.dispose(); journeyPanel = null; }
      choiceEngine = null;
      setJourneyHighlight(null);
      setHighlightStream(null);
      document.getElementById('stream-controls').style.display = 'none';
    }

    async function loadChoiceCase7() {
      // Cas 7 : choix vivants. La 3D réutilise le rejeu horaire du Cas 5
      // (cônes 1 h) avec une plage de lecture étendue ; le panneau montre les
      // prochaines actions possibles, cliquables, fournies par choice-engine.
      let data, bounds;
      try {
        [data, bounds] = await Promise.all([
          loadCircuits('./data'),
          fetch('./data/map_bounds.json').then(r => r.json()),
        ]);
      } catch (err) {
        alert(`Les données du Cas 7 sont introuvables.\n\n${err.message}`);
        return;
      }

      // Lecture jusqu'à la fin des horaires chargés (10h30 après la re-sync).
      const dataEndS = Math.max(...data.circuits.flatMap(c =>
        c.trips.map(t => t.schedule[t.schedule.length - 1]?.t_arr ?? 0)), 0);
      const t0 = data.index.t0_seconds;
      const playHorizonS = Math.max(data.index.horizon_s, dataEndS - t0);

      const model = createScheduleModel(data, { playHorizonS });
      routes = model.routes;

      choiceEngine = createChoiceEngine({
        circuits: data.circuits,
        sigma: data.index.sigma,
        originLines: ['51', '66'],
        destLines:   ['480', '144'],
        departS: t0,
      });

      init(canvas, {
        routes,
        transferWindows: [],
        mapBackground: { url: './data/map_montreal.png', bounds },
        // buildTimeGrid s'étend jusqu'à t0 + 2×horizonS → moitié de la plage de lecture
        timeGrid: { t0Seconds: t0, horizonS: playHorizonS / 2, bounds },
      });

      document.getElementById('prob-display').style.display = 'none';   // hors récit (cas 1/2)
      const USER_COLOR = 0xffdd22;
      initPassengers(1, [USER_COLOR]);
      setPassengerT0(t0);
      setPassengerSource(tAbs => [{
        journey_id: 1, color: USER_COLOR,
        ...choiceEngine.getPassenger(tAbs),
      }]);

      // Surlignage : le choix survolé (ou engagé) éclaire son trajet en 3D —
      // ses bus restent nets, les autres s'estompent — et anime un flux de
      // bonhommes le long du trajet (temps machine). Voir les curseurs du HUD.
      function applyHighlight(choice) {
        const tAbs = t0 + (player?.simTime ?? 0);
        const reals = choice ? choiceEngine.getChoiceRealizations(choice, tAbs) : null;
        // Estompage 3D : tous les bus de toutes les réalisations (chemin engagé + replis)
        const trips = reals ? [...new Set(reals.flatMap(r => r.path.tripIds))] : null;
        setJourneyHighlight(trips);
        setHighlightStream(reals);
        update();   // reflète l'estompage même en pause
      }

      journeyPanel = createChoicePanel({
        container: document.getElementById('legend'),
        engine: choiceEngine,
        t0,
        onHighlightChoice: applyHighlight,
      });

      // Paramètres initiaux du flux depuis les curseurs temporaires
      setStreamParams({
        mode: document.getElementById('stream-mode').value,
        spacingS: Number(document.getElementById('stream-spacing').value) * 60,
        speedMul: Number(document.getElementById('stream-speed').value),
      });
      document.getElementById('stream-controls').style.display = '';

      player = model;
      player.setSpeed(Number(document.getElementById('speed-select').value));
      update();
    }

    async function loadJourneyCase6() {
      let journeysData, bounds, circuitsData;
      try {
        [journeysData, bounds, circuitsData] = await Promise.all([
          fetch('./data/journeys_case6.json').then(r => r.json()),
          fetch('./data/map_bounds.json').then(r => r.json()),
          loadCircuits('./data'),
        ]);
      } catch (err) {
        alert(`Les données du Cas 6 sont introuvables.\n\n${err.message}\n\nVérifier que journeys_case6.json et les circuits STM sont présents dans web/data/.`);
        return;
      }

      const model = createJourneyModel({ journeysData, circuits: circuitsData.circuits });
      routes = model.routes;

      init(canvas, {
        routes,
        transferWindows: [],
        mapBackground: { url: './data/map_montreal.png', bounds },
        timeGrid: { t0Seconds: model.t0Seconds, horizonS: model.horizonS, bounds },
      });

      const colors = journeysData.journeys.map((_, i) => JOURNEY_COLORS[i % JOURNEY_COLORS.length]);
      initPassengers(journeysData.journeys.length, colors);
      setPassengerT0(model.t0Seconds);
      setPassengerSource(tAbs => model.getPassengerPositions(tAbs));

      // Vignette timeline : remplace entièrement le contenu de #legend
      journeyPanel = createJourneyPanel({
        container: document.getElementById('legend'),
        journeysData,
        tripStarts: model.tripStarts,
        onJourneySelect: tripIds => setJourneyHighlight(tripIds),
      });

      player = model;
      player.setSpeed(Number(document.getElementById('speed-select').value));
      update();
    }

    async function load(scenarioId) {
      teardownWalkMode();
      teardownJourneyPanel();
      restoreStoryLegend();   // cas 5/6 la remplaceront par leur propre légende
      if (scenarioId === '3') {
        loadWalkCase();
        return;
      }
      if (scenarioId === '4') {
        await loadStmCase();
        return;
      }
      if (scenarioId === '5') {
        await loadStmSimulationCase();
        return;
      }
      if (scenarioId === '6') {
        await loadJourneyCase6();
        return;
      }
      if (scenarioId === '7') {
        await loadChoiceCase7();
        return;
      }
      const data = await loadScenario(`./data/scenario${scenarioId}.json`);
      routes = data.routes;
      init(canvas, { routes, transferWindows: data.transfer_windows ?? [] });
      setVizMode(document.getElementById('viz-mode-select').value);
      player = createPlayer(data.frames);
      player.setSpeed(Number(document.getElementById('speed-select').value));
      update();
    }

    async function loadStmSimulationCase() {
      // Cas 5 : géométrie STM réelle + carte OSM + cônes d'incertitude
      // reconstruits à la volée depuis les horaires compacts par circuit
      // (fichiers circuits/*.json + circuits_index.json, schéma scalable).
      let model, bounds, indexCircuits;
      try {
        const [data, b] = await Promise.all([
          loadCircuits('./data'),
          fetch('./data/map_bounds.json').then(r => r.json()),
        ]);
        bounds = b;
        indexCircuits = data.index.circuits;
        model = createScheduleModel(data);
      } catch (err) {
        alert(
          `Les circuits STM n'ont pas encore été générés.\n\n${err.message}\n\n` +
          `Lancer le workflow data-sync.yml (onglet Actions) ou exécuter ` +
          `localement : uv run python data/blocks/build_scenario_stm.py`
        );
        return;
      }
      routes = model.routes;
      setCircuitLegend(indexCircuits);
      init(canvas, {
        routes,
        transferWindows: [],
        stopEvents: [],
        mapBackground: { url: './data/map_montreal.png', bounds },
        timeGrid: { t0Seconds: model.t0Seconds, horizonS: model.horizonS, bounds },
      });
      player = model;
      player.setSpeed(Number(document.getElementById('speed-select').value));
      update();
    }

    async function loadStmCase() {
      // Cas 4 : géométrie réelle des 6 lignes STM + fond de carte OSM.
      // Pas encore de simulation horaire — affichage statique des tracés.
      player = null;
      const [routesData, bounds] = await Promise.all([
        fetch('./data/routes_stm.json').then(r => r.json()),
        fetch('./data/map_bounds.json').then(r => r.json()),
      ]);
      routes = routesData;
      init(canvas, {
        routes,
        transferWindows: [],
        mapBackground: { url: './data/map_montreal.png', bounds },
      });
      // Pas de mode viz spécifique — seuls les tracés au sol sont affichés
    }

    function loadWalkCase() {
      // Cas 3 : réseau inventé, pas de données de simulation.
      // Petit réseau factice pour que init() calcule latCenter/lonCenter.
      player = null;
      routes = null;
      // Symétrique autour de (45.508, -73.640) = LAT_REF/LON_REF du mode walk
      const dummyRoute = {
        line_id: 'WALK',
        shape: [{ lat: 45.495, lon: -73.655 }, { lat: 45.521, lon: -73.625 }],
        stops: [], length_m: 2800,
      };
      init(canvas, { routes: [dummyRoute], transferWindows: [] });
      setVizMode('walk');
    }

    // Mise à jour DOM : appelée à chaque tick RAF pour un affichage fluide
    function fmtLocalClock(totalSec) {
      const s = ((Math.round(totalSec) % 86400) + 86400) % 86400;
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      return `${h}h${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }

    function updateHud() {
      if (!player || !routes) return;
      document.getElementById('time-display').textContent =
        `T = ${Math.round(player.simTime)} s`;
      // Heure locale réelle quand le scénario porte des horaires (cas 5).
      const clockEl = document.getElementById('clock-display');
      if (player.t0Seconds != null) {
        clockEl.style.display = '';
        clockEl.textContent = '🕐 ' + fmtLocalClock(player.t0Seconds + player.simTime);
      } else {
        clockEl.style.display = 'none';
      }
      const transfers = player.frame?.transfers ?? [];
      const isStoryMode = !!player.frame?.vehicles?.find(v => v.vehicle_id === 'L42-util');
      const probDisplay = document.getElementById('prob-display');
      probDisplay.style.display = isStoryMode ? '' : 'none';
      if (!isStoryMode) return;
      const l33 = transfers.find(t => t.to_vehicle_id === 'L33-util');
      const l17 = transfers.find(t => t.to_vehicle_id === 'L17-util');
      document.getElementById('prob-l33').textContent =
        l33 ? (l33.probability * 100).toFixed(1) + ' %' : '—';
      document.getElementById('prob-l17').textContent =
        l17 ? (l17.probability * 100).toFixed(1) + ' %' : '—';
      const probL33 = l33?.probability ?? 0;
      const sugEl = document.getElementById('suggestion');
      const connectorId = probL33 >= 0.50 ? 'L33-util' : 'L17-util';
      if (probL33 >= 0.50) {
        sugEl.textContent = '→ Rester sur L42, transfert à P3 → L33';
        sugEl.style.color = '#44cc44';
      } else {
        sugEl.textContent = '→ Descendre à P1, prendre L17';
        sugEl.style.color = '#ff8844';
      }
      const connVeh = player.frame?.vehicles?.find(v => v.vehicle_id === connectorId);
      const connRoute = routes.find(r => r.line_id === connectorId.split('-')[0]);
      let tArrival = null;
      if (connVeh && connRoute) {
        const LAT_M = 111000;
        const lm = LAT_M * Math.cos(connRoute.shape[0].lat * Math.PI / 180);
        let rLen = 0;
        for (let i = 1; i < connRoute.shape.length; i++) {
          const dy = (connRoute.shape[i].lat - connRoute.shape[i-1].lat) * LAT_M;
          const dx = (connRoute.shape[i].lon - connRoute.shape[i-1].lon) * lm;
          rLen += Math.sqrt(dy*dy + dx*dx);
        }
        const nearEnd = rLen * 0.97;
        const traj = connVeh.trajectory;
        for (let i = 0; i < traj.length; i++) {
          if (traj[i].p50 >= nearEnd) {
            if (i === 0) { tArrival = traj[0].t; break; }
            const a = traj[i - 1], b = traj[i];
            tArrival = a.t + (nearEnd - a.p50) / (b.p50 - a.p50) * (b.t - a.t);
            break;
          }
        }
      }
      const arrEl = document.getElementById('arrival');
      arrEl.textContent = tArrival != null
        ? `Arrivée estimée : T = ${Math.round(tArrival)} s (${Math.floor(tArrival/60)} min ${Math.round(tArrival%60)} s)`
        : 'Arrivée estimée : hors horizon';
    }

    // Appelée lors du chargement initial et du rembobinage
    function update() {
      if (!player || !routes) return;
      renderFrame(player.frame, routes);
      updateHud();
    }

    // Métriques de debug
    const dbg = {
      tickDelta: 0, tickDeltaMax: 0,
      drawMax: 0, fps: 0,
      frameIdx: 0,
      _fpsCount: 0, _fpsTs: 0,
    };
    function updateDebug(rawDeltaMs) {
      dbg.tickDelta = rawDeltaMs;
      if (rawDeltaMs > dbg.tickDeltaMax) dbg.tickDeltaMax = rawDeltaMs;
      const drawMs = lastDrawMs; // live binding depuis renderer.js
      if (drawMs > dbg.drawMax) dbg.drawMax = drawMs;
      dbg._fpsCount++;
      const now = performance.now();
      if (now - dbg._fpsTs >= 1000) {
        dbg.fps = dbg._fpsCount;
        dbg._fpsCount = 0;
        dbg._fpsTs = now;
        // Réinitialiser les max toutes les secondes
        dbg.tickDeltaMax = rawDeltaMs;
        dbg.drawMax = drawMs;
      }
      document.getElementById('dbg-tick-delta').textContent = rawDeltaMs.toFixed(1) + ' ms';
      document.getElementById('dbg-tick-max').textContent  = dbg.tickDeltaMax.toFixed(1) + ' ms';
      document.getElementById('dbg-draw-ms').textContent   = drawMs.toFixed(1) + ' ms';
      document.getElementById('dbg-draw-max').textContent  = dbg.drawMax.toFixed(1) + ' ms';
      document.getElementById('dbg-fps').textContent       = dbg.fps;
      document.getElementById('dbg-frame-idx').textContent = dbg.frameIdx;
    }

    function tick(ts) {
      requestAnimationFrame(tick);
      const rawDeltaMs = lastTs !== null ? (ts - lastTs) : 0;
      if (lastTs !== null && player?.isPlaying) {
        const wallDelta = Math.min(rawDeltaMs / 1000, 0.1);
        const frameChanged = player.tick(wallDelta);
        if (frameChanged) {
          dbg.frameIdx++;
          renderFrame(player.frame, routes);
        }
        updateHud();
      }
      if (player) {
        updateSimTime(player.simTime);
        journeyPanel?.update(player.simTime);
      }
      if (lastTs !== null) updateDebug(rawDeltaMs);
      // Rose des vents : theta positif = caméra vers l'Est → N pointe à droite = +deg CSS
      document.getElementById('compass').style.transform =
        `rotate(${(getAzimuthalAngle() * 180 / Math.PI).toFixed(1)}deg)`;
      lastTs = ts;
    }

    document.getElementById('btn-play').onclick    = () => player?.play();
    document.getElementById('btn-pause').onclick   = () => player?.pause();
    document.getElementById('btn-rewind').onclick  = () => {
      player?.seekTo(0);
      if (choiceEngine) {        // Cas 7 : oublier les engagements et les colonnes
        choiceEngine.reset();
        journeyPanel?.reset?.();
        setJourneyHighlight(null);
        setHighlightStream(null);
      }
      update();
    };

    // Cas 7 : curseurs temporaires du flux de bonhommes de surlignage
    document.getElementById('stream-mode').onchange = e =>
      setStreamParams({ mode: e.target.value });
    document.getElementById('stream-spacing').oninput = e => {
      document.getElementById('stream-spacing-val').textContent = e.target.value;
      setStreamParams({ spacingS: Number(e.target.value) * 60 });
    };
    document.getElementById('stream-speed').oninput = e => {
      document.getElementById('stream-speed-val').textContent = e.target.value;
      setStreamParams({ speedMul: Number(e.target.value) });
    };
    document.getElementById('speed-select').onchange = e =>
      player?.setSpeed(Number(e.target.value));
    document.getElementById('scenario-select').onchange = e => load(e.target.value);
    document.getElementById('viz-mode-select').onchange = e => {
      setVizMode(e.target.value);
      update();
    };
    document.getElementById('chk-p50').onchange = e => {
      setShowP50(e.target.checked);
      update();
    };
    document.getElementById('chk-uncertainty').onchange = e => {
      setShowUncertainty(e.target.checked);
      update();
    };

    fetch('./data/build_info.json')
      .then(r => r.ok ? r.json() : null)
      .then(info => {
        if (!info) return;
        document.getElementById('build-info').innerHTML =
          `Sim : ${info.sim_date}<br>Visu : ${info.viz_built_at}`;
      })
      .catch(() => {});

    await load(1);
    requestAnimationFrame(tick);
  </script>
</body>
</html>
